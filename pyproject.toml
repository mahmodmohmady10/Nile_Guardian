[project]
name = "nile-guardian-rpg"
version = "0.0.1"
description = "حارس النيل: رحلة الأمين — لعبة أدوار ثنائية الأبعاد بالعربية"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.coverage.run]
source = ["src/core", "src/logic", "src/world"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
